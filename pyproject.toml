[project]
name = "scan-namer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-auth-oauthlib>=1.5.0",
    "google-auth>=2.59.1",
    "google-api-python-client>=2.201.0",
    "google-genai>=2.27.0",
    "anthropic>=1.11.0",
    "openai>=3.23.0",
    "pypdf>=6.19.0",
    "requests>=2.31.0",
    "python-dotenv>=1.2.4",
    "types-requests",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
