[project]
name = "scan-namer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-auth-oauthlib>=1.5.0",
    "google-auth>=2.59.1",
    "google-api-python-client>=2.201.0",
    "google-genai>=2.27.0",
    "anthropic>=1.11.0",
    "openai>=3.23.0",
    "pypdf>=6.19.0",
    "requests>=2.31.0",
    "python-dotenv>=1.2.4",
    "types-requests",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "LOG",  # flake8-logging
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest checks
    "S105",  # fake secrets are test fixtures
    "S106",
    "S108",  # temp paths in fixtures
]
