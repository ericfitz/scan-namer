[project]
name = "scan-namer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-auth-oauthlib>=1.4.1",
    "google-auth>=2.57.1",
    "google-api-python-client>=2.200.0",
    "google-genai>=2.22.0",
    "anthropic>=1.3.0",
    "openai>=3.8.0",
    "pypdf>=6.16.2",
    "requests>=2.31.0",
    "python-dotenv>=1.2.3",
    "types-requests",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
